<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POE 寶石價格 (中英對照)</title>
  <style>
    :root {
      --bg:          #0d1117;
      --bg2:         #161b22;
      --bg3:         #1c2230;
      --border:      #30363d;
      --gold:        #c8a85a;
      --gold-light:  #e8c870;
      --text:        #e6edf3;
      --muted:       #8b949e;
      --red:         #e05252;
      --green:       #52c05a;
      --blue:        #5299e0;
      --purple:      #a088e0;
      --white-gem:   #c8c8c8;
      --corrupted:   #cc4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

    /* ── HEADER ── */
    .header {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 10px 40px; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 10px;
      position: sticky; top: 0; z-index: 200;
    }
    .header-title { display: flex; align-items: center; gap: 10px; }
    .header-title h1 { font-size: 1.3rem; color: var(--gold); font-weight: 700; letter-spacing: .02em; }
    .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .league-select {
      background: var(--bg3); border: 1px solid var(--border); color: var(--text);
      padding: 5px 10px; border-radius: 6px; font-size: .88rem; cursor: pointer;
    }
    .league-select:focus { outline: none; border-color: var(--gold); }
    .update-info { font-size: .92rem; color: var(--muted); }
    .refresh-btn {
      background: var(--bg3); border: 1px solid var(--border); color: var(--muted);
      padding: 5px 12px; border-radius: 6px; font-size: .96rem; cursor: pointer;
      transition: all .15s;
    }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── FILTERS ── */
    .filters {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 10px 40px; display: flex; flex-direction: column; gap: 8px;
      position: sticky; top: 50px; z-index: 190;
    }
    .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-label { font-size: .92rem; color: var(--muted); min-width: 42px; }
    .btn-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .fbtn {
      padding: 5px 14px; border: 1px solid var(--border); background: var(--bg3);
      color: var(--muted); border-radius: 20px; font-size: .94rem; cursor: pointer;
      transition: all .15s; user-select: none;
    }
    .fbtn:hover { border-color: var(--gold); color: var(--text); }
    .fbtn.active { background: var(--gold); border-color: var(--gold); color: #111; font-weight: 700; }
    .fbtn.c-red.active  { background: var(--red);   border-color: var(--red);   color: #fff; }
    .fbtn.c-green.active{ background: var(--green); border-color: var(--green); color: #111; }
    .fbtn.c-blue.active { background: var(--blue);  border-color: var(--blue);  color: #fff; }
    .search-wrap { margin-left: auto; }
    .search-input {
      background: var(--bg3); border: 1px solid var(--border); color: var(--text);
      padding: 5px 14px; border-radius: 20px; font-size: .98rem; width: 260px; outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: var(--muted); }

    /* ── STATS BAR ── */
    .stats-bar {
      padding: 6px 40px; font-size: .94rem; color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }

    /* ── TABLE ── */
    body { overflow-x: auto; }
    .table-wrap { padding: 0 40px 20px; max-width: 1400px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 1rem; }
    thead th {
      background: var(--bg2); color: var(--muted); padding: 7px 8px;
      text-align: left; font-weight: 500; font-size: .88rem;
      text-transform: uppercase; letter-spacing: .05em;
      border-bottom: 2px solid var(--border);
      position: sticky; top: var(--thead-top, 0px); white-space: nowrap; user-select: none;
      box-shadow: 0 2px 4px rgba(0,0,0,.4);
    }
    thead th.sort { cursor: pointer; }
    thead th.sort:hover { color: var(--gold); }
    thead th.sort-asc::after  { content: ' ↑'; color: var(--gold); }
    thead th.sort-desc::after { content: ' ↓'; color: var(--gold); }
    td { padding: 5px 8px; border-bottom: 1px solid rgba(48,54,61,.45); vertical-align: middle; }
    /* 名稱欄限制寬度 */
    td.name-col { max-width: 260px; min-width: 180px; }
    /* 通貨欄置右 */
    td.val-price, th.val-price { text-align: right; white-space: nowrap; }
    tr:hover td { background: rgba(255,255,255,.02); }

    /* gem icon */
    .gem-icon { width: 30px; height: 30px; object-fit: contain; display: block; }

    /* name cell */
    .name-cell { display: flex; align-items: center; gap: 8px; }
    .gem-names { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
    .gem-zh { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gem-en { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gem-zh { font-weight: 500; color: var(--text); }
    .gem-en { font-size: .76rem; color: var(--muted); }
    .copy-btn {
      flex-shrink: 0; margin-left: auto; background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 2px 8px; border-radius: 4px;
      font-size: .72rem; cursor: pointer; white-space: nowrap; transition: all .15s;
      width: 52px; text-align: center;
    }
    .copy-btn:hover { border-color: var(--gold); color: var(--gold); }
    .copy-btn.ok    { border-color: var(--green); color: var(--green); }

    /* badges */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: .72rem; font-weight: 600; white-space: nowrap;
    }
    .badge-Awakened    { background: rgba(200,168,90,.15); color: var(--gold);    border: 1px solid rgba(200,168,90,.35); }
    .badge-Vaal        { background: rgba(200,60,60,.15);  color: #e07070;        border: 1px solid rgba(200,60,60,.35);  }
    .badge-Transfigured{ background: rgba(120,80,200,.15); color: var(--purple);  border: 1px solid rgba(120,80,200,.35); }
    .badge-Normal      { background: rgba(100,100,100,.1); color: var(--muted);   border: 1px solid var(--border);        }

    .color-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .dot-red   { background: var(--red); }
    .dot-green { background: var(--green); }
    .dot-blue  { background: var(--blue); }
    .dot-white { background: var(--white-gem); }

    .variant-tag {
      background: rgba(80,80,100,.3); border: 1px solid rgba(80,80,100,.5);
      border-radius: 4px; padding: 1px 6px; font-size: .72rem; color: var(--muted);
    }

    .val-divine { color: var(--gold-light); font-weight: 600; display:inline-block; min-width:64px; text-align:right; font-variant-numeric: tabular-nums; }
    .val-chaos  { color: var(--muted); display:inline-block; min-width:80px; text-align:right; font-variant-numeric: tabular-nums; }
    .price-sep  { color: var(--border); margin: 0 4px; }
    .val-lvq    { white-space: nowrap; }
    .lvq-lv     { display:inline-block; min-width:24px; text-align:right; font-variant-numeric: tabular-nums; }
    .lvq-sep    { color: var(--border); margin: 0 3px; }
    .lvq-q      { display:inline-block; min-width:24px; text-align:right; font-variant-numeric: tabular-nums; }
    .orb-icon { width:18px; height:18px; vertical-align:middle; margin-left:5px; }
    .medium-conf { color: #f0b429; font-size: 1em; margin-right: 3px; cursor:default; title:"Medium Confidence（樣本數 5–9）"; }
    .medium-conf::before { content: '⚠ '; }
    .val-chaos  { color: var(--text); }
    .corrupted  { color: var(--corrupted); font-weight: 700; }
    .not-corr   { color: var(--muted); }
    .trend-up   { color: var(--green); font-size: 1rem; font-weight: 600; }
    .trend-dn   { color: var(--red);   font-size: 1rem; font-weight: 600; }

    /* ── PAGINATION ── */
    .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 18px; flex-wrap: wrap; }
    .pg-btn {
      padding: 5px 12px; border: 1px solid var(--border); background: var(--bg3);
      color: var(--muted); border-radius: 6px; cursor: pointer; font-size: .82rem; transition: all .15s;
    }
    .pg-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
    .pg-btn.active { background: var(--gold); border-color: var(--gold); color: #111; font-weight: 700; }
    .pg-btn:disabled { opacity: .35; cursor: default; }
    .pg-dots { color: var(--muted); padding: 0 4px; }

    /* ── LOADING / EMPTY ── */
    .center-msg { display: flex; align-items: center; justify-content: center; padding: 60px 20px; color: var(--muted); font-size: 1rem; gap: 10px; }
    .spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FILTER TOGGLE (手機用) ── */
    .filter-toggle-bar {
      display: none;
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 8px 16px; position: sticky; top: 52px; z-index: 195;
      align-items: center; gap: 10px;
    }
    .filter-toggle-btn {
      background: var(--bg3); border: 1px solid var(--border); color: var(--muted);
      padding: 5px 14px; border-radius: 20px; font-size: .9rem; cursor: pointer;
      flex-shrink: 0; transition: all .15s;
    }
    .filter-toggle-btn.has-filter { border-color: var(--gold); color: var(--gold); }
    .filter-toggle-search {
      flex: 1; background: var(--bg3); border: 1px solid var(--border); color: var(--text);
      padding: 5px 14px; border-radius: 20px; font-size: .9rem; outline: none;
      transition: border-color .15s;
    }
    .filter-toggle-search:focus { border-color: var(--gold); }
    .filter-toggle-search::placeholder { color: var(--muted); }

    /* ── 卡片版面 ── */
    .gem-cards { display: none; padding: 8px 12px 20px; }
    .gem-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .gem-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .gem-card-icon { width: 36px; height: 36px; object-fit: contain; flex-shrink: 0; }
    .gem-card-names { flex: 1; min-width: 0; }
    .gem-card-zh { font-weight: 600; font-size: .98rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gem-card-en { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gem-card-copy {
      flex-shrink: 0; background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 3px 10px; border-radius: 4px;
      font-size: .78rem; cursor: pointer; transition: all .15s; width: 52px; text-align: center;
    }
    .gem-card-copy:hover { border-color: var(--gold); color: var(--gold); }
    .gem-card-copy.ok    { border-color: var(--green); color: var(--green); }
    .gem-card-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .gem-card-price { display: flex; align-items: center; justify-content: space-between; }
    .gem-card-left  { display: flex; align-items: center; gap: 6px; }
    .gem-card-right { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }

    @media (max-width: 768px) {
      /* header 縮小 */
      .header { padding: 8px 14px; }
      .header-title h1 { font-size: 1rem; }
      .update-info { display: none; }

      /* filter bar 收合 */
      .filter-toggle-bar { display: flex; }
      .filters {
        top: 90px; /* header(52) + toggle-bar(38) */
        display: none;
        padding: 10px 14px;
      }
      .filters.open { display: flex; }

      /* stats bar */
      .stats-bar { padding: 5px 14px; font-size: .82rem; }

      /* 隱藏桌面表格，顯示卡片 */
      .table-wrap { display: none; }
      .gem-cards  { display: block; }

      /* 分頁 */
      .pagination { padding: 10px; gap: 4px; }
      .pg-btn { padding: 4px 10px; font-size: .8rem; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">
    <img src="image/Portal_(skill_gem)_inventory_icon.png" style="width:28px;height:28px;object-fit:contain">
    <h1>POE 寶石價格 (中英對照)</h1>
  </div>
  <div class="header-right">
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:.8rem;color:var(--muted)">聯賽</label>
      <select id="leagueSelect" class="league-select" onchange="onLeagueChange()">
        <option>載入中…</option>
      </select>
    </div>
    <span class="update-info" id="updateInfo">—</span>
    <button class="refresh-btn" onclick="loadGems()">🔄 重新整理</button>
  </div>
</div>

<!-- MOBILE: FILTER TOGGLE BAR -->
<div class="filter-toggle-bar">
  <button id="filterToggleBtn" class="filter-toggle-btn" onclick="toggleFilters()">篩選 ▼</button>
  <input id="mobileSearch" class="filter-toggle-search" type="text" placeholder="🔍 搜尋寶石（中文 / EN）" oninput="onMobileSearch()">
</div>

<!-- FILTERS -->
<div class="filters" id="filtersPanel">
  <div class="filter-row">
    <span class="filter-label">類型</span>
    <div class="btn-group" id="typeGroup">
      <button class="fbtn active" data-t="All"              onclick="setType(this)">全部</button>
      <button class="fbtn"        data-t="Awakened"         onclick="setType(this)">覺醒</button>
      <button class="fbtn"        data-t="Non-transfigured" onclick="setType(this)">非變異</button>
      <button class="fbtn"        data-t="Normal"           onclick="setType(this)">一般</button>
      <button class="fbtn"        data-t="Transfigured"     onclick="setType(this)">變異</button>
      <button class="fbtn"        data-t="Vaal"             onclick="setType(this)">汙染</button>
    </div>
    <div class="btn-group" id="supportGroup" style="margin-left:8px;padding-left:12px;border-left:1px solid var(--border)">
      <button class="fbtn active" data-s="All"     onclick="setSupport(this)">全部</button>
      <button class="fbtn"        data-s="support" onclick="setSupport(this)">輔助</button>
      <button class="fbtn"        data-s="active"  onclick="setSupport(this)">非輔助</button>
    </div>
  </div>
  <div class="filter-row">
    <span class="filter-label">等級</span>
    <div class="btn-group" id="levelGroup">
      <button class="fbtn active" data-lv="All" onclick="setLevel(this)">全部</button>
      <button class="fbtn" data-lv="1"  onclick="setLevel(this)">1</button>
      <button class="fbtn" data-lv="3"  onclick="setLevel(this)">3</button>
      <button class="fbtn" data-lv="4"  onclick="setLevel(this)">4</button>
      <button class="fbtn" data-lv="20" onclick="setLevel(this)">20</button>
      <button class="fbtn" data-lv="21" onclick="setLevel(this)">21</button>
    </div>
    <span class="filter-label" style="margin-left:16px">品質</span>
    <div class="btn-group" id="qualityGroup">
      <button class="fbtn active" data-q="All"  onclick="setQuality(this)">全部</button>
      <button class="fbtn"        data-q="low"  onclick="setQuality(this)">0~19</button>
      <button class="fbtn"        data-q="20"   onclick="setQuality(this)">20%</button>
      <button class="fbtn"        data-q="23"   onclick="setQuality(this)">23%</button>
    </div>
  </div>
  <div class="filter-row">
    <span class="filter-label">顏色</span>
    <div class="btn-group" id="colorGroup">
      <button class="fbtn active"  data-c="All"   onclick="setColor(this)">全部</button>
      <button class="fbtn c-red"   data-c="red"   onclick="setColor(this)">力量</button>
      <button class="fbtn c-green" data-c="green" onclick="setColor(this)">敏捷</button>
      <button class="fbtn c-blue"  data-c="blue"  onclick="setColor(this)">智慧</button>
    </div>
    <div class="search-wrap" style="display:flex;align-items:center;gap:8px;margin-left:auto">
      <button id="lowConfBtn" class="fbtn" onclick="toggleLowConf()" title="顯示市場資料不足的寶石（poe.ninja Low Confidence）">低信心資料</button>
      <input id="searchInput" class="search-input" type="text" placeholder="🔍 搜尋寶石（中文 / EN）" oninput="onSearch()">
    </div>
  </div>
</div>

<!-- STATS -->
<div class="stats-bar">
  <span id="statsText">載入中…</span>
  <span id="pageInfo" style="color:var(--muted);font-size:.78rem"></span>
</div>

<!-- MOBILE CARDS -->
<div class="gem-cards" id="cardArea"></div>

<!-- TABLE -->
<div class="table-wrap">
  <div id="tableArea">
    <div class="center-msg"><div class="spinner"></div>正在載入寶石資料…</div>
  </div>
</div>

<!-- PAGINATION -->
<div class="pagination" id="pagination"></div>

// STATE
// ════════════════════════════════════════════
let allGems = [], filteredGems = [], nameSet = new Set();
let currentLeague = '';
let typeFilter = 'All', colorFilter = 'All', supportFilter = 'All', searchQuery = '';
let levelFilter = 'All', qualityFilter = 'All';
let showLowConf = false;
let sortKey = 'divineValue', sortDir = 'desc';
let currentPage = 1;
const PAGE_SIZE = 100;

// ════════════════════════════════════════════
// CLASSIFY
// ════════════════════════════════════════════
function classify(name) {
  if (name.startsWith('Awakened ')) return 'Awakened';
  if (name.startsWith('Vaal '))     return 'Vaal';
  if (name.includes(' of ')) {
    const i = name.lastIndexOf(' of ');
    if (nameSet.has(name.substring(0, i))) return 'Transfigured';
  }
  return 'Normal';
}

// ════════════════════════════════════════════
// API  (CORS proxy 解決跨域限制)
// ════════════════════════════════════════════
// Cloudflare Worker proxy（自架，解決 poe.ninja CORS 問題）
const WORKER_BASE = 'https://poe-gems-proxy.motorrockqoo.workers.dev';

async function apiFetch(poeNinjaPath) {
  const url = WORKER_BASE + poeNinjaPath;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} from worker`);
  return r.json();
}

async function fetchLeagues() {
  try {
    const d = await apiFetch('/poe1/api/data/index-state');
    const leagues = d.economyLeagues || [];
    const sel = document.getElementById('leagueSelect');
    sel.innerHTML = leagues.map(l =>
      `<option value="${l.name}">${l.displayName || l.name}</option>`
    ).join('');
    currentLeague = leagues[0]?.name || 'Mirage';
    sel.value = currentLeague;
  } catch(e) { console.error('League fetch failed', e); }
}

async function loadGems() {
  document.getElementById('tableArea').innerHTML =
    '<div class="center-msg"><div class="spinner"></div>正在載入寶石資料…</div>';
  document.getElementById('statsText').textContent = '載入中…';
  document.getElementById('pagination').innerHTML = '';

  try {
    const d = await apiFetch(`/poe1/api/economy/stash/current/item/overview?type=SkillGem&league=${encodeURIComponent(currentLeague)}`);

    nameSet = new Set(d.lines.map(g => g.name));

allGems = d.lines.map(g => {
      const lu = GL[g.name] || {};
      const cnt = g.count ?? 0;
      const lowConf    = cnt < 5;
      const mediumConf = cnt >= 5 && cnt < 10;
      const isSupport = g.name.includes('Support');
      return { ...g, zh: lu.zh || g.name, color: lu.c || 'white', gemType: classify(g.name), lowConf, mediumConf, isSupport };
    });

    document.getElementById('updateInfo').textContent =
      '更新：' + new Date().toLocaleTimeString('zh-TW');
    currentPage = 1;
    applyFilters();
  } catch(e) {
    document.getElementById('tableArea').innerHTML =
      `<div class="center-msg" style="flex-direction:column;gap:8px">
         <span style="font-size:1.4rem">⚠️</span>
         <span>載入失敗</span>
         <span style="font-size:.78rem;color:var(--muted)">錯誤：${e.name} — ${e.message}</span>
         <span style="font-size:.72rem;color:var(--muted)">請開啟 F12 → Console 查看詳細錯誤</span>
       </div>`;
    console.error('[loadGems error]', e);
  }
}

// ════════════════════════════════════════════
// FILTER + SORT
// ════════════════════════════════════════════
function applyFilters() {
  const q = searchQuery.toLowerCase();
  filteredGems = allGems.filter(g => {
    // type
    if (typeFilter === 'Non-transfigured' && g.gemType === 'Transfigured') return false;
    if (typeFilter !== 'All' && typeFilter !== 'Non-transfigured' && g.gemType !== typeFilter) return false;
    // color
    if (colorFilter !== 'All' && g.color !== colorFilter) return false;
    // support
    if (supportFilter === 'support' && !g.isSupport) return false;
    if (supportFilter === 'active'  &&  g.isSupport) return false;
    // level / quality
    if (levelFilter !== 'All' && String(g.gemLevel??'') !== levelFilter) return false;
    if (qualityFilter === 'low') {
      if (g.gemQuality != null && g.gemQuality >= 20) return false;
    } else if (qualityFilter !== 'All') {
      if (String(g.gemQuality??'') !== qualityFilter) return false;
    }
    // low confidence
    if (!showLowConf && g.lowConf) return false;
    // search
    if (q && !g.name.toLowerCase().includes(q) && !g.zh.includes(searchQuery)) return false;
    return true;
  });

  // sort
  filteredGems.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb||'').toLowerCase(); }
    va = va ?? -Infinity; vb = vb ?? -Infinity;
    return va < vb ? (sortDir==='asc'?-1:1) : va > vb ? (sortDir==='asc'?1:-1) : 0;
  });

  document.getElementById('statsText').textContent =
    `共 ${filteredGems.length.toLocaleString()} 筆（總計 ${allGems.length.toLocaleString()} 筆）`;
  currentPage = 1;
  renderTable();
  renderCards();
  renderPagination();
}

function thHtml(label, key) {
  const cls = sortKey === key ? (sortDir==='asc' ? ' sort-asc' : ' sort-desc') : '';
  return `<th class="sort${cls}" onclick="setSort('${key}')">${label}</th>`;

function renderTable() {
  const start = (currentPage - 1) * PAGE_SIZE;

  if (!page.length) {
    document.getElementById('tableArea').innerHTML =
      '<div class="center-msg">😮 找不到符合條件的寶石</div>';
    document.getElementById('pageInfo').textContent = '';

  let rows = '';
  for (const g of page) {
    const div    = g.divineValue  != null ? g.divineValue.toFixed(2)            : '—';
    const chaos  = g.chaosValue   != null ? Math.round(g.chaosValue).toLocaleString() : '—';
    const trend  = g.sparkLine?.totalChange;
    const tHtml  = trend && trend !== 0
      ? `<span class="${trend>0?'trend-up':'trend-dn'}">&nbsp;${trend>0?'▲':'▼'}${Math.abs(trend).toFixed(1)}%</span>`
      : '';
    const dotCls = `dot-${g.color==='white'?'white':g.color}`;

    // escape quote for inline onclick
    const zhSafe = g.zh.replace(/'/g, '&#39;');

    rows += `<tr>
      <td><img class="gem-icon" src="${g.icon}" alt="" loading="lazy" onerror="this.style.opacity=0"></td>
      <td class="name-col">
        <div class="name-cell">
          <div class="gem-names">
            <span class="gem-zh">${g.zh}</span>
            <span class="gem-en">${g.name}</span>
          </div>
          <button class="copy-btn" onclick="doCopy(this,'${zhSafe}')">複製</button>
        </div>
      </td>
      <td><span class="badge badge-${g.gemType}">${TYPE_ZH[g.gemType]||g.gemType}</span></td>
      <td><span class="color-dot ${dotCls}" style="width:11px;height:11px;margin-right:7px"></span>${COLOR_ZH[g.color]||g.color}</td>
      <td class="val-lvq"><span class="lvq-lv">${g.gemLevel??'—'}</span><span class="lvq-sep"> / </span><span class="lvq-q">${g.gemQuality!=null ? g.gemQuality : '—'}</span></td>
      <td class="val-price">
        ${g.mediumConf?'<span class="medium-conf" title="Medium Confidence（樣本數 5–9）"></span>':''}
        <span class="val-divine">${div}</span><img src="image/Divine_Orb_inventory_icon.png" class="orb-icon" title="神聖石">
        <span class="price-sep"> / </span>
        <span class="val-chaos">${chaos}</span><img src="image/Chaos_Orb_inventory_icon.png" class="orb-icon" title="混沌石">
      </td>
      <td class="val-trend" style="text-align:right">${tHtml || '<span style="color:var(--muted)">—</span>'}</td>
      <td class="hide-sm" style="color:var(--muted)">${g.listingCount!=null ? '~'+Math.round(g.listingCount/10)*10 : '—'}</td>
    </tr>`;
  }

  const nameCls = (sortKey==='zh'?(sortDir==='asc'?' sort-asc':' sort-desc'):'');

  document.getElementById('tableArea').innerHTML = `
  <table>
    <thead><tr>
      <th>圖示</th>
      <th class="sort${nameCls}" onclick="setSort('zh')">名稱</th>
      <th>類型</th>
      <th>顏色</th>
      <th>Lv/Q</th>
      <th class="sort val-price${sortKey==='divineValue'?(sortDir==='asc'?' sort-asc':' sort-desc'):''}" onclick="setSort('divineValue')">神聖石 / 混沌石</th>
      <th>最近 7 天</th>
      <th class="hide-sm">上架數</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  const end = Math.min(start + PAGE_SIZE, filteredGems.length);
  document.getElementById('pageInfo').textContent =
    `第 ${start+1}–${end} 筆，共 ${filteredGems.length.toLocaleString()} 筆`;
}

// ════════════════════════════════════════════
// RENDER PAGINATION
// ════════════════════════════════════════════
function renderPagination() {
  const total = Math.ceil(filteredGems.length / PAGE_SIZE);
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  const pages = [];
  for (let i = 1; i <= total; i++) {
    if (i===1 || i===total || Math.abs(i-currentPage)<=2) pages.push(i);
    else if (pages[pages.length-1] !== '…') pages.push('…');
  }

  let h = `<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ 上頁</button>`;
  pages.forEach(p => {
    if (p==='…') h += `<span class="pg-dots">…</span>`;
    else h += `<button class="pg-btn${p===currentPage?' active':''}" onclick="goPage(${p})">${p}</button>`;
  });
  h += `<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>下頁 ›</button>`;
  document.getElementById('pagination').innerHTML = h;
}

async function doCopy(btn, text) {
  try { await navigator.clipboard.writeText(text); }
  catch { /* fallback */ const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t); }
  btn.textContent = '✓ 已複製'; btn.classList.add('ok');
  setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('ok'); }, 1500);
}

function onMobileSearch() {
  searchQuery = document.getElementById('mobileSearch').value;
  // 同步桌面搜尋框
  const desk = document.getElementById('searchInput');
  if (desk) desk.value = searchQuery;
  currentPage = 1; applyFilters();
}

// ════════════════════════════════════════════
// STICKY THEAD — 動態計算 top 偏移
// ════════════════════════════════════════════
function updateStickyTop() {
  const header  = document.querySelector('.header');
  const filters = document.querySelector('.filters');
  if (!header || !filters) return;
  const h = header.getBoundingClientRect().height + filters.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--thead-top', h + 'px');
}
window.addEventListener('load',   updateStickyTop);
window.addEventListener('resize', updateStickyTop);

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
(async () => { await fetchLeagues(); await loadGems(); updateStickyTop(); })();
</script>
